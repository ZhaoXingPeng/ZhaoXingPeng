name: 生成主页工程指标

on:
  schedule:
    - cron: "5 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render-metrics:
    if: github.repository == 'ZhaoXingPeng/ZhaoXingPeng'
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ZhaoXingPeng
          template: classic
          filename: assets/generated/github-metrics.svg
          base: header, community, repositories, metadata
          base_indepth: yes
          repositories: 6
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          config_timezone: Asia/Hong_Kong
          config_display: large
          config_padding: 10, 8 + 8%
          plugins_errors_fatal: no
